<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title></title>
  <meta name="description" content="Portfolio of Patrick Sagun — real estate & property video editing, vertical & horizontal reels, house tours, photography." />
  <style>
    :root{--accent:#8b2121;--white:#fff;--glass:rgba(0,0,0,0.55);font-family:'Montserrat',Arial,Helvetica,sans-serif;}
    html,body{height:100%;margin:0;background:transparent;color:var(--white);scroll-behavior:smooth}
    .bg-hero{position:fixed;inset:0;z-index:-2;background:#000 center/cover no-repeat;filter:brightness(.28) saturate(.95) contrast(.95);background-image:url('assets/Video_Editing_Timeline.jpg');background-size:cover;background-position:center;}
    header{display:flex;align-items:center;justify-content:center;padding:18px 28px}
    .logo-wrap{display:flex;align-items:center;gap:12px}
    .logo-wrap img{height:100px;display:block}
    .container{max-width:1200px;margin:0 auto;padding:24px}
    .hero{min-height:54vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;position:relative;z-index:5;}
    h1{font-size:44px;margin:0 0 8px;letter-spacing:1px;text-transform:uppercase}
    .sub{opacity:.9}
    .cta{display:inline-block;background:var(--accent);padding:12px 22px;border-radius:24px;margin-top:18px;font-weight:800}
    .selections{display:flex;flex-direction:column;gap:20px;align-items:center;margin:30px 0;position:relative;z-index:5;}
    .sel{width:min(92%,920px);background:rgba(139,33,33,.85);padding:20px;border-radius:40px;display:flex;align-items:center;justify-content:center}
    .sel a{color:white;text-decoration:none;font-weight:900;font-size:30px;letter-spacing:1px;text-transform:uppercase}
    .section-title{display:flex;align-items:center;justify-content:center;margin:28px 0}
    .pill{background:var(--accent);padding:10px 20px;border-radius:26px;font-weight:800}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;position:relative;z-index:5;}
    .video-thumb{background:rgba(0,0,0,.45);border-radius:8px;overflow:hidden;cursor:pointer;position:relative}
    .video-thumb img{width:100%;height:220px;object-fit:cover;display:block}
    .video-title{position:absolute;left:12px;bottom:10px;background:rgba(0,0,0,.6);padding:6px 10px;border-radius:6px;font-weight:700}
    .photo-cards{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
    .photo-card{background:rgba(0,0,0,.45);padding:12px;border-radius:8px;min-width:260px;text-align:center}
    .photo-card a{display:inline-block;margin-top:10px;padding:8px 12px;background:var(--accent);color:#fff;border-radius:8px;text-decoration:none;font-weight:800}
    footer{padding:48px 18px;text-align:center}
    .contact-grid{display:flex;gap:40px;align-items:center;justify-content:center;flex-wrap:wrap}
    .contact-card{min-width:240px;background:rgba(0,0,0,.45);padding:18px;border-radius:12px}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;align-items:center;justify-content:center}
    .modal.active{display:flex}
    .modal-content{position:relative;width:90vw;max-width:1200px}
    .modal iframe{width:100%;height:56vw;max-height:720px;border:none;border-radius:8px}
    .close-btn{position:absolute;top:-32px;right:0;font-size:44px;cursor:pointer;color:#fff}

    @media(max-width:1024px){
      .grid{grid-template-columns:repeat(2,1fr)}
      .video-thumb img{height:200px}
    }

    @media(max-width:640px){
      .grid{grid-template-columns:1fr}
      .logo-wrap img{height:44px}
    }
  </style>
</head>
<body>
  <div class="bg-hero" aria-hidden></div>
  <header class="container">
    <div class="logo-wrap">
      <img src="assets/Logo4.png" alt="Patrick Sagun logo" />
    </div>
  </header>

  <!-- Rest of content unchanged (due to length) -->
</body>
</html>
